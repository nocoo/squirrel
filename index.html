<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Squirrel（松鼠）：Cloudflare Workers MCP 个人密钥托管服务。" />
    <meta name="theme-color" content="#d97706" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Squirrel · 个人密钥托管 MCP</title>
    <script>
      (() => {
        let stored = null;
        try { stored = localStorage.getItem("theme"); } catch { stored = null; }
        const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
